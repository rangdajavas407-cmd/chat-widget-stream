<!doctype html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chat Widget Studio — Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Poppins:wght@400;600;800&family=Quicksand:wght@400..700&family=Rubik:wght@400..800&family=Playfair+Display:wght@500..800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0d13;--p:#11141d;--c:#171b27;--i:#0d1018;--l:#262c3d;--t:#eef0f8;--m:#8089a0;--ac:#7c6cf2;--ac2:#b8aefc;--ff:Inter;--gap:10px;--fs:14px;--fw:500}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--t);font:13px/1.4 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:8px 12px;background:var(--ac);color:#fff;font-weight:600;font-size:12px;transition:.18s}
button:hover{filter:brightness(1.15)}button:active{transform:scale(.96)}
button.g{background:var(--c);border:1px solid var(--l)}button.g:hover{border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:400px 1fr}
aside{display:flex;flex-direction:column;background:var(--p);border-right:1px solid var(--l);min-height:0}
header{padding:16px 16px 0}h1{margin:0 0 12px;font-size:17px}h1 b{color:var(--ac2)}
nav{display:flex;border-bottom:1px solid var(--l);overflow-x:auto}
nav button{flex:1;background:none;border-radius:0;color:var(--m);padding:10px 8px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav button.on{color:#fff;border-color:var(--ac)}
#body{flex:1;overflow:auto;padding:14px 16px 30px}
.sheet{display:none}.sheet.on{display:block;animation:up .3s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:0 0 12px;font-size:12.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f{margin-bottom:10px}
label{display:flex;justify-content:space-between;font-size:11.5px;color:#a7aec2;margin-bottom:5px}
label span{color:var(--m)}label.ck{justify-content:flex-start;gap:7px;align-items:center}
input[type=text],select,textarea{width:100%;padding:8px 10px;background:var(--i);border:1px solid var(--l);border-radius:9px;outline:0;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #7c6cf22e}
input[type=color]{width:100%;height:34px;padding:3px;background:var(--i);border:1px solid var(--l);border-radius:9px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--ac)}
textarea{min-height:130px;font:12px/1.6 ui-monospace,monospace;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 8px;background:var(--i);border:1.5px solid var(--l);color:var(--m);font-size:10px;border-radius:12px}
.tile:hover{border-color:var(--ac);transform:translateY(-2px);filter:none}.tile.on{border-color:var(--ac);background:#7c6cf222;color:#fff}
.tile .bub{font-size:11px;font-weight:700;zoom:.7;white-space:nowrap;max-width:none;min-width:0}.tile .bub[data-d=bunny]{zoom:.55}
.tile .fl{white-space:nowrap}.tile{overflow:hidden}
.sw{width:100%;height:22px;border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.rc{display:flex;align-items:center;gap:7px;background:var(--i);border:1.5px solid var(--l);color:var(--m)}
.rc.on{border-color:var(--ac);color:#fff}.rc i{width:12px;height:12px;border-radius:50%}
.pv{margin-top:6px;padding:22px 14px;border-radius:12px;background:#303449}
.help{color:var(--m);font-size:11px;margin:0 0 8px}
.log{margin-top:10px;padding:10px;background:#0a0c11;border-left:3px solid var(--ac);border-radius:6px;font:11.5px/1.7 ui-monospace,monospace;white-space:pre-wrap}
.btns{display:flex;gap:7px;margin-top:10px}.btns button{flex:1}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:8px;padding:12px 18px;background:var(--p);border-bottom:1px solid var(--l);flex-wrap:wrap}
.bar b{flex:1;font-size:14px}.bar select{width:auto}
#pv{flex:1;overflow:auto;padding:40px 30px 30px;background:#303449 linear-gradient(45deg,#ffffff0a 25%,transparent 25% 75%,#ffffff0a 75%) 0 0/32px 32px;display:flex;align-items:flex-end;justify-content:flex-end;transition:background .3s}
/*ENGINE-CSS-START*/
#chat{width:min(500px,100%);display:flex;flex-direction:column;gap:var(--gap);font-family:var(--ff),system-ui,sans-serif;font-weight:var(--fw)}
.msg{display:flex;gap:8px;align-items:flex-start;will-change:transform,opacity}
.msg.out{pointer-events:none;animation:msgOut .4s ease forwards}
.msg.out .mb{animation:mbOut .4s ease forwards}
@keyframes msgOut{to{opacity:0}}
@keyframes mbOut{to{transform:translateX(-12px) scale(.94)}}
/* masuk: pegas kecil, kekuatannya mengikuti panjang chat (--sc & --dur diisi dari JS) */
.mb{transform-origin:0 100%;animation:mbIn var(--dur,.55s) cubic-bezier(.22,.9,.3,1.1) backwards}
@keyframes mbIn{0%{opacity:0;transform:translate(-14px,10px) scale(var(--sc,.9))}55%{opacity:1;transform:translate(1px,-2px) scale(calc(1 + (1 - var(--sc,.9)) * .25))}100%{opacity:1;transform:none}}
@keyframes nmIn{from{opacity:0;transform:translateX(-10px) scale(.9)}}
@keyframes txIn{from{opacity:0;transform:translateY(5px)}}
.av{flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 0 0 2px #fffd,0 4px 10px #0004;animation:avpop .55s cubic-bezier(.2,.9,.3,1.5) backwards}
@keyframes avpop{from{transform:scale(.3) rotate(-30deg)}}
.mb{min-width:0;flex:0 1 auto;max-width:calc(100% - 46px)}
.nm{display:flex;width:max-content;max-width:100%;align-items:center;gap:6px;margin:0 0 7px 4px;padding:3px 10px 3px 8px;border-radius:99px;font-size:11px;font-weight:800;box-shadow:0 2px 8px #0003;transform-origin:0 50%;animation:nmIn .45s cubic-bezier(.22,.9,.3,1.2) .06s backwards}
.nm i,.nm b{flex:none}.nm s{text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm b{font-size:9px;padding:2px 7px;border-radius:99px;background:#0004}
.bub{position:relative;display:inline-block;max-width:calc(100% - var(--mx,0px));min-width:60px}
.ol,.fl{transition:background .25s,border-radius .25s}
.ol{position:absolute;z-index:1}.fl{position:relative;z-index:2;font-size:var(--fs);line-height:1.45;overflow-wrap:anywhere;text-wrap:pretty}
.fl span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:8;overflow:hidden;animation:txIn .5s ease .16s backwards}
.bub em{position:absolute;z-index:4;font-style:normal;top:-12px;right:-6px}
.bub em[data-p="1"]{right:auto;left:-6px}.bub em[data-p="2"]{top:auto;bottom:-10px}.bub em[data-p="3"]{top:auto;bottom:-10px;right:auto;left:-6px}.bub em[data-p="4"]{right:auto;left:50%;transform:translateX(-50%)}
.orn{display:inline-block;position:relative;line-height:1;font-size:var(--s,16px);color:var(--c)}
.orn.m{width:1em;height:1em;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.orn.t{animation:fl 2.6s ease-in-out infinite;filter:drop-shadow(0 2px 3px #0005)}
.orn[data-k=star],.orn[data-k=sparkle]{animation:tw2 2s ease-in-out infinite}@keyframes tw2{0%,100%{transform:scale(.85) rotate(0);opacity:.7;filter:drop-shadow(0 0 2px currentColor)}50%{transform:scale(1.2) rotate(25deg);opacity:1;filter:drop-shadow(0 0 8px currentColor)}}
.orn[data-k=heart]{animation:beat 1.2s ease-in-out infinite;filter:drop-shadow(0 0 4px currentColor)}@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.28)}30%{transform:scale(1)}45%{transform:scale(1.2)}}
.orn[data-k=moon]{animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 0 5px currentColor)}
.orn[data-k=bolt]{animation:flk 1.6s infinite;filter:drop-shadow(0 0 5px currentColor)}@keyframes flk{0%,100%{opacity:1}30%{opacity:.35}60%{opacity:.9}}
.orn[data-k=diamond]{background:linear-gradient(115deg,currentColor 35%,#fff 50%,currentColor 65%) 0 0/250% 100%;animation:shift 2.2s linear infinite}
.orn[data-k=crown]{background:linear-gradient(110deg,#c98f12,#ffe27a 40%,#fff 50%,#ffe27a 60%,#c98f12) 0 0/250% 100%;animation:shift 2.2s linear infinite,fl 3s ease-in-out infinite;filter:drop-shadow(0 0 4px #ffd24d)}
.orn[data-k=flame]{background:linear-gradient(0deg,#ff2d00,#ff9d00 55%,#ffe27a);transform-origin:50% 100%;animation:fk .9s ease-in-out infinite;filter:drop-shadow(0 0 5px #ff6a00)}@keyframes fk{0%,100%{transform:scale(1) skewX(-4deg)}50%{transform:scale(.9,1.15) skewX(5deg)}}
.orn[data-k=drop]{animation:dr 2s ease-in infinite}@keyframes dr{0%{transform:translateY(-4px) scale(.7);opacity:0}30%{opacity:1}100%{transform:translateY(6px) scale(1);opacity:.2}}
.orn[data-k=snow]{animation:sp 6s linear infinite;filter:drop-shadow(0 0 4px currentColor)}.orn[data-k=flower]{animation:sp 8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.orn[data-k=leaf]{transform-origin:20% 90%;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:rotate(14deg) translateX(2px)}}
.orn[data-k=eye]{width:1.5em;height:.95em;border-radius:50%;background:#fff;overflow:hidden;box-shadow:inset 0 0 0 .07em color-mix(in srgb,currentColor,#000 45%),0 0 .35em color-mix(in srgb,currentColor,transparent 55%)}
.orn[data-k=eye]::before{content:"";position:absolute;left:50%;top:50%;width:.62em;height:.62em;margin:-.31em 0 0 -.31em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 .07em,transparent .08em),radial-gradient(circle,#050505 0 .17em,currentColor .18em);animation:look 5s ease-in-out infinite}
.orn[data-k=eye]::after{content:"";position:absolute;inset:-1px;background:color-mix(in srgb,currentColor,#000 40%);transform-origin:50% 0;transform:scaleY(0);animation:lid 4.4s infinite}
@keyframes look{30%{transform:translateX(-.25em)}60%{transform:translateX(.25em)}}@keyframes lid{0%,91%,100%{transform:scaleY(0)}94%{transform:scaleY(1)}}
.orn[data-k=feather]{width:1.3em;height:.5em;border-radius:50% 0 50% 0;background:linear-gradient(90deg,currentColor,#fff5);animation:sw 2.6s ease-in-out infinite}
.orn[data-k=cube]{width:1.1em;height:1.1em;background:linear-gradient(135deg,#8be9ff,#6d7cff 50%,#27294d);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);filter:drop-shadow(0 0 6px currentColor);animation:fl 3.4s ease-in-out infinite}
.orn[data-k=isometric]{width:1.3em;height:1em;background:linear-gradient(135deg,currentColor,#fff3);clip-path:polygon(0 40%,50% 0,100% 40%,100% 60%,50% 100%,0 60%);animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 0 5px currentColor)}
/* ornamen emoji */
.orn[data-k=mic]{transform-origin:50% 90%;animation:tilt 4s ease-in-out infinite}
.orn[data-k=rainbow]{animation:pop 1.3s ease-in-out infinite}
.orn[data-k=teddy]{transform-origin:50% 100%;animation:wob 2.2s ease-in-out infinite}
.orn[data-k=cherry],.orn[data-k=note]{animation:fl 2.6s ease-in-out infinite}
.orn[data-k=bunny]{transform-origin:50% 100%;animation:hop 1.1s ease-in-out infinite}
.orn[data-k=wind],.orn[data-k=cloud]{animation:drift 2.6s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateX(-3px)}50%{transform:translateX(5px)}}
@keyframes tilt{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-16deg)}88%{transform:rotate(14deg)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-7px) scale(.95,1.08)}}
/* ornamen CSS murni (Idol) */
.orn[data-k=eq]{width:1.1em;height:.95em;background:linear-gradient(currentColor,currentColor) 0 100%/.2em 40% no-repeat,linear-gradient(currentColor,currentColor) .3em 100%/.2em 80% no-repeat,linear-gradient(currentColor,currentColor) .6em 100%/.2em 55% no-repeat,linear-gradient(currentColor,currentColor) .9em 100%/.2em 90% no-repeat;filter:drop-shadow(0 0 4px currentColor);animation:eq 1.1s ease-in-out infinite}
.orn[data-k=lightstick]{width:.17em;height:1.1em;margin:.35em .35em 0;border-radius:.1em;background:linear-gradient(180deg,#fff 0,currentColor 15%,currentColor 55%,#2a2a35 55%);transform-origin:50% 100%;animation:wob 2.2s ease-in-out infinite}
.orn[data-k=lightstick]::before{content:"";position:absolute;left:50%;top:-.38em;width:.5em;height:.7em;margin-left:-.25em;border-radius:.25em;background:radial-gradient(circle at 50% 30%,#fff,currentColor 65%);box-shadow:0 0 .5em currentColor,0 0 1em color-mix(in srgb,currentColor,transparent 40%);animation:pulse 1.2s ease-in-out infinite}
@keyframes eq{0%,100%{background-size:.2em 40%,.2em 80%,.2em 55%,.2em 90%}33%{background-size:.2em 85%,.2em 35%,.2em 90%,.2em 45%}66%{background-size:.2em 55%,.2em 95%,.2em 35%,.2em 75%}}
@keyframes glup{0%{opacity:0;transform:translateY(5px) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translateY(-26px) scale(1)}}
.gl2{width:4px;height:4px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor;opacity:0;animation:glup var(--t) ease-out var(--d) infinite}
.fx{position:absolute;pointer-events:none}.fx *{position:absolute;pointer-events:none}
.cr{width:8px;height:3px;border-radius:2px;background:currentColor;opacity:0;animation:crfly var(--t) linear var(--d) infinite}
@keyframes crfly{0%{opacity:0;transform:translate(0,0) rotate(0)}30%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(540deg)}}
.cu{font-size:10px;line-height:1;opacity:0;animation:flt var(--t) ease-out var(--d) infinite}
@keyframes flt{0%{opacity:0;transform:translateY(2px) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translateY(-28px) rotate(25deg) scale(1.1)}}
/* garis angin (tema Windy) */
.wl{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,currentColor);opacity:0;animation:wlfly var(--t) ease-in var(--d) infinite}
@keyframes wlfly{0%{opacity:0;transform:translateX(0)}20%{opacity:.9}100%{opacity:0;transform:translateX(var(--dx))}}
.cw{font-size:11px;line-height:1;opacity:0;animation:blow var(--t) ease-in-out var(--d) infinite}
@keyframes blow{0%{opacity:0;transform:translate(0,0) rotate(0)}20%{opacity:1}50%{transform:translate(calc(var(--dx)*.5),-8px) rotate(120deg)}100%{opacity:0;transform:translate(var(--dx),6px) rotate(300deg)}}
[data-fx=windy]{animation:windsway 4s ease-in-out infinite}
@keyframes windsway{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(3px) rotate(.5deg)}}
[data-fx=d3]{animation:d3float 4s ease-in-out infinite}
@keyframes d3float{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-4px) rotate(.4deg)}}
[data-fx=idol]{animation:idolpulse 2s ease-in-out infinite}
@keyframes idolpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
[data-fx=cute]{animation:cutebounce 2.4s cubic-bezier(.3,.6,.4,1) infinite}
@keyframes cutebounce{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-4px) scale(.985,1.02)}60%{transform:translateY(0) scale(1.015,.985)}}
@keyframes shift{to{background-position:200% 0}}@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes pulse{50%{opacity:.55}}@keyframes fl{50%{transform:translateY(-4px)}}
@keyframes earL{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-2deg)}}@keyframes earR{0%,100%{transform:rotate(10deg)}50%{transform:rotate(2deg)}}
@keyframes bowjig{50%{transform:rotate(-8deg) scale(1.08)}}
@media(max-width:900px){.app{grid-template-columns:1fr;height:auto}aside{max-height:60vh}#pv{min-height:480px}}
.seg{display:flex;gap:4px;padding:4px;background:var(--i);border-radius:12px;margin-bottom:12px}.seg button{flex:1;background:none;color:var(--m)}.seg button.on{background:var(--ac);color:#fff}
.pane{display:none}.pane.on{display:block;animation:up .3s ease}.og{grid-template-columns:repeat(4,1fr)}
.dc{position:absolute;pointer-events:none;display:none;z-index:0}.bub[data-d] .dc{display:block}
/*ENGINE-CSS-END*/
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--c);border:1px solid var(--ac);padding:10px 16px;border-radius:99px;z-index:200;animation:up .3s}
body.obs{background:transparent}body.obs aside,body.obs .bar{display:none}body.obs .app{display:block}body.obs #pv{background:none!important;height:100vh;padding:10px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style></head><body>

</div>
<div id="pv"><div id="chat"></div></div></main></div>
<script>
const SRC='<!doctype html>\n'+document.documentElement.outerHTML;
/*ENGINE-JS-START*/
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];

['Pita',(c,d)=>`polygon(0 0,100% 0,calc(100% - ${14+d*.5}px) 50%,100% 100%,0 100%,${14+d*.5}px 50%)`,{c:1,xp:14}],
['Label',(c,d)=>`polygon(0 0,calc(100% - ${14+d}px) 0,100% 50%,calc(100% - ${14+d}px) 100%,0 100%)`,{xp:8}],
['Amplop',()=>'polygon(0 0,100% 0,100% 72%,50% 100%,0 72%)',{c:1,pb:12}],
['Pixel',(c,d)=>{const s=Math.max(4,c/3|0);return `polygon(${s}px 0,calc(100% - ${s}px) 0,calc(100% - ${s}px) ${s}px,100% ${s}px,100% calc(100% - ${s}px),calc(100% - ${s}px) calc(100% - ${s}px),calc(100% - ${s}px) 100%,${s}px 100%,${s}px calc(100% - ${s}px),0 calc(100% - ${s}px),0 ${s}px,${s}px ${s}px)`}],
['🐰 Kelinci',[.9,.9,.9,.9],{d:'bunny',ext:[32,0,0]}],

['🎀 Pita Lucu',[1.1,1.1,1.1,1.1],{d:'ribbon',ext:[10,0,6]}],
['🍬 Permen',[1.2,1.2,1.2,1.2],{d:'wrap',c:1,ext:[0,0,18]}],
['Sticker',[1.2,1.2,1.2,1.2],{f:()=>'drop-shadow(2px 0 #fff) drop-shadow(-2px 0 #fff) drop-shadow(0 2px #fff) drop-shadow(0 -2px #fff)'}],
['Glass',[1,1,1,1],{mat:'glass'}],
['Metal',[.9,.9,.9,.9],{mat:'metal'}],
['Gold',[.8,.8,.8,.8],{mat:'gold',c:1}],

['🍃 Windy',[1.8,.5,1.8,.5],{d:'wind',ext:[0,0,14],mat:'windy'}],

function sync(){$$('[data-s]').forEach(i=>i.value=S[i.dataset.s]);$$('[data-v]').forEach(v=>v.textContent=S[v.dataset.v])}
$$('[data-s]').forEach(i=>i.oninput=()=>{S[i.dataset.s]=i.type==='range'?+i.value:i.value;sync();paint()});
$('#reset').onclick=()=>{if(confirm('Reset semua pengaturan?')){S={...S0};roles=mkRoles();sync();rebuild();paint()}};
function renderShapes(){const g=$('#sg');g.innerHTML='';SH.forEach(([n],i)=>{const b=document.createElement('button'),x=mkBub('Aa');b.className='tile'+(S.sh===i?' on':'');paintBub(x,{sh:i,r:10,bw:2,px:14,py:5,pat:'gradient',c1:S.a1,c2:S.a2,fill:S.bubble,txt:S.bt});b.append(x,n);b.onclick=()=>{S.sh=i;paint()};g.appendChild(b)})}
const eds=[];
function plat(pf,title){
  const el=$('#s_'+pf),list=roles.filter(r=>r.pf===pf);let cur=list[0];
  const pats=()=>{$('.pg',el).innerHTML=Object.keys(PT).map(k=>{const [bg,an,fi]=PT[k](cur.c1,cur.c2);return `<button class="tile ${cur.pat===k?'on':''}" data-p="${k}"><div class="sw" style="background:${bg};animation:${an||'none'};filter:${fi||'none'}"></div>${k}${FXB[k]?' ✦':''}</button>`}).join('');
    $$('[data-p]',el).forEach(b=>b.onclick=()=>{cur.pat=b.dataset.p;pats();paint();pvw()})};
  const orns=()=>{const g=$('.og',el);g.innerHTML='';['',...Object.keys(ON)].forEach(k=>{const b=document.createElement('button'),w=document.createElement('div');b.className='tile'+((cur.orn||'')===k?' on':'');w.style.cssText='height:28px;display:grid;place-items:center';if(k)w.appendChild(mkOrn(k,cur.c1,16));else w.textContent='-';b.append(w,k?ON[k]:'Tanpa');b.onclick=()=>{cur.orn=k;orns();paint();pvw()};g.appendChild(b)})};
  const pvw=()=>{const b=$('.pv',el);b.innerHTML='';const m=msg(cur.label+'_user','Contoh pesan '+cur.label,pf,cur.id);b.appendChild(m);apply(m,true)};
  function draw(){
    cur=roles.find(r=>r.id===cur.id);
    el.innerHTML=`<div class="card"><h2>Role ${title}</h2><div class="chips">${list.map(r=>`<button class="rc ${r.id===cur.id?'on':''}" data-id="${r.id}"><i style="background:linear-gradient(135deg,${r.c1},${r.c2})"></i>${r.label}${r.on?'':' · off'}</button>`).join('')}</div></div>
    <div class="card"><h2>${cur.label}</h2><label class="ck"><input type="checkbox" data-k="on" ${cur.on?'checked':''}> Aktifkan role ini</label><br>
    <div class="row2"><div class="f"><label>Warna 1</label><input type="color" data-k="c1" value="${cur.c1}"></div><div class="f"><label>Warna 2</label><input type="color" data-k="c2" value="${cur.c2}"></div>
    <div class="f"><label>Tebal outline</label><input type="range" data-k="bw" min="1" max="12" value="${cur.bw}"></div><div class="f"><label>Glow</label><input type="range" data-k="glow" min="0" max="20" value="${cur.glow}"></div></div>
    <label>Ornamen</label><div class="grid og"></div><div class="row2" style="margin-top:10px"><div class="f"><label>Ukuran</label><input type="range" data-k="os" min="10" max="40" value="${cur.os}"></div><div class="f"><label>Posisi</label><select data-k="op">${['Kanan atas','Kiri atas','Kanan bawah','Kiri bawah','Tengah atas'].map((n,i)=>`<option value="${i}" ${cur.op==i?'selected':''}>${n}</option>`).join('')}</select></div></div>
    <label>Motif outline</label><div class="grid pg"></div><div class="pv"></div></div>`;
    $$('.rc',el).forEach(b=>b.onclick=()=>{cur=roles.find(r=>r.id===b.dataset.id);draw()});
    $$('[data-k]',el).forEach(i=>i.oninput=()=>{const k=i.dataset.k;cur[k]=i.type==='checkbox'?i.checked:(i.type==='range'||k==='op')?+i.value:i.value;paint();pvw();if(k==='c1'||k==='c2'){pats();orns()}if(k==='on')draw()});
    pats();orns();pvw();
  }
  draw();eds.push(draw);
}
const rebuild=()=>{eds.length=0;plat('tiktok','TikTok');plat('youtube','YouTube')};
/* [nama, ikon, aksen1, aksen2, isi bubble, teks, font, indeks bentuk, motif, ornamen[]] */
const THEMES=[
['Classic','✨','#8b5cf6','#ec4899','#ffffff','#272938','Inter',sIx('Chat'),'gradient',['star','heart','sparkle','crown']],
['3D','🧊','#8be9ff','#3a2a8a','#3a2a8a','#ffffff','Poppins',sIx('🧊 3D'),'d3',['cube','isometric','diamond']],
['Windy','🍃','#38bdf8','#86efac','#f0f9ff','#0c4a6e','Quicksand',sIx('🍃 Windy'),'windy',['wind','leaf','feather','cloud']],
['Kawaii','🍓','#ff9ecb','#c9b8ff','#fff5fa','#7a3b5c','Quicksand',sIx('🍓 Kawaii'),'cute',['cherry','bunny','rainbow','teddy','sparkle']],
['Idol','🎤','#ff4fa3','#7c3aed','#1a0f2e','#ffe6f5','Poppins',sIx('🎤 Idol'),'idol',['eq','mic','lightstick','sparkle']],
['Elegan','👑','#d4af37','#8a6a1c','#17141a','#f3e6c4','Playfair Display',sIx('👑 Elegan'),'bar',['crown','diamond','star','sparkle']]];
function applyTheme(t){
  Object.assign(S,{a1:t[2],a2:t[3],bubble:t[4],bt:t[5],font:t[6],sh:t[7]});
  roles.filter(r=>['tt_gift','yt_super','tt_like','yt_like'].includes(r.id)).forEach(r=>r.pat=t[8]);
  roles.forEach((r,i)=>{r.orn=t[9][i%t[9].length];r.os=20;r.ox=r.oy=0});sync();rebuild();paint();
}
$('#s_theme').innerHTML=`<div class="card"><h2>Tema cepat</h2><p class="help">Klik untuk menerapkan bentuk, warna, motif, dan ornamen ke seluruh widget.</p><div class="grid" style="grid-template-columns:1fr 1fr">${THEMES.map((t,i)=>`<button class="tile" data-th="${i}" style="padding:12px"><div class="sw" style="height:30px;background:linear-gradient(135deg,${t[2]},${t[3]})"></div><b style="color:#fff;font-size:12px">${t[1]} ${t[0]}</b></button>`).join('')}</div></div>`;
$$('[data-th]').forEach(b=>b.onclick=()=>applyTheme(THEMES[b.dataset.th]));
const COL={putih:'#ffffff',hitam:'#0f1117',merah:'#ef4444',biru:'#3b82f6',hijau:'#22c55e',kuning:'#eab308',ungu:'#8b5cf6',pink:'#ec4899',emas:'#d4af37',oranye:'#f97316',abu:'#6b7280',tosca:'#06b6d4'};
const CW=Object.keys(COL).join('|'),AL={api:'flame',emas:'gold',pelangi:'rainbow',titik:'dots',garis:'stripes',bintang:'sparkle',catur:'checker',angin:'windy',imut:'cute',kawaii:'cute',elegan:'bar',idol:'idol'};
function chatCode(txt){const t=txt.toLowerCase(),o=[],pick=re=>{const m=t.match(re);return m&&m[1]};THEMES.forEach(th=>{if(t.includes('tema '+th[0].toLowerCase())){applyTheme(th);o.push(`✓ tema ${th[0]}`)}});
  const bi=t.indexOf('border');if(bi>=0){const seg=t.slice(bi,bi+28),c=seg.match(new RegExp(CW)),w=seg.match(/(\d+)\s*px/);if(c)S.a1=COL[c[0]];if(w)S.bw=Math.min(10,+w[1]);o.push(`✓ outline ${c?c[0]:''} ${w?w[1]+'px':''}`)}
  const rad=pick(/sudut\s+(?:melengkung|bulat|tumpul)?\s*(\d+)/);if(rad){S.r=Math.min(40,+rad);o.push('✓ sudut '+S.r+'px')}
  const bg=pick(new RegExp(`(?:warna|latar|isi)\\s+(${CW})`));if(bg){S.bubble=COL[bg];o.push('✓ isi bubble '+bg)}
  const tx=pick(new RegExp(`(?:teks|tulisan)\\s+(${CW})`));if(tx){S.bt=COL[tx];o.push('✓ teks '+tx)}
  if(t.includes('glow')){const c=pick(new RegExp(`glow\\s+(${CW})`));roles.forEach(r=>{r.glow=12;if(c)r.c1=COL[c]});o.push('✓ glow '+(c||''))}
  const mo=pick(/(?:motif|efek|outline)\s+([\wé-]+)/);if(mo){const k=AL[mo]||(PT[mo]?mo:null);if(k){roles.forEach(r=>r.pat=k);o.push('✓ motif '+k)}else o.push(`✗ motif "${mo}" tidak dikenali`)}
  const bt=pick(/bentuk\s+([\w ]+?)(?:,|$)/);if(bt){const i=SH.findIndex(s=>s[0].toLowerCase().includes(bt.trim()));if(i>=0){S.sh=i;o.push('✓ bentuk '+SH[i][0])}}
  sync();rebuild();paint();return o.length?o.join('\n'):'Tidak ada kata kunci yang dikenali.'}

let cfgWs=null;
function connectCfgWs(){const proto=location.protocol==='https:'?'wss:':'ws:';if(!location.host)return;try{cfgWs=new WebSocket(`${proto}//${location.host}`);cfgWs.onopen=()=>{console.log('[CFG-WS] ✓');try{cfgWs.send(JSON.stringify({type:'state',state:{S,roles,css}}))}catch(e){}};cfgWs.onmessage=ev=>{try{const d=JSON.parse(ev.data);if(d.type==='config'&&d.config)console.log('[CFG-WS] config diterima')}catch(e){}};cfgWs.onclose=()=>{console.warn('[CFG-WS] putus, reconnect');setTimeout(connectCfgWs,2500)};cfgWs.onerror=()=>{try{cfgWs.close()}catch(e){}}}catch(e){setTimeout(connectCfgWs,3000)}}
connectCfgWs();
function save(){const payload={S,roles,css};try{localStorage.setItem('cws-v12',JSON.stringify(payload))}catch(e){}try{if(cfgWs&&cfgWs.readyState===1){cfgWs.send(JSON.stringify({type:'state',state:payload}))}}catch(e){}}
try{const d=JSON.parse(localStorage.getItem('cws-v12')||'null');if(d){Object.assign(S,d.S);(d.roles||[]).forEach(r=>{const x=roles.find(y=>y.id===r.id);x&&Object.assign(x,r)})}}catch(e){}
