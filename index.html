<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatWidget Studio — by ran</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at top left, #27245a, transparent 35%),
    radial-gradient(circle at bottom right, #193b61, transparent 35%),
    #0f1020;
  color: #fff;
}

.card {
  width: min(520px, 100%);
  padding: 22px;
  border: 1px solid #30334f;
  border-radius: 20px;
  background: rgba(24, 26, 45, .96);
  box-shadow: 0 25px 80px #0008;
}

h1 {
  margin: 0 0 6px;
  font-size: 22px;
  letter-spacing: -.01em;
}

.subtitle {
  margin: 0 0 18px;
  color: #aeb1c9;
  line-height: 1.5;
  font-size: 13px;
}

/* TABS — 2 kolom */
.tabs {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  padding: 5px;
  margin-bottom: 16px;
  background: #0c0e1b;
  border: 1px solid #30334f;
  border-radius: 14px;
}

.tab {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 9px 4px 8px;
  background: transparent;
  border: 0;
  border-radius: 10px;
  color: #8589a6;
  font: inherit;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .03em;
  cursor: pointer;
  transition: .18s;
}

.tab:hover { background: rgba(255,255,255,.03); color: #c9cbe0; }
.tab.active { background: #1c1f33; color: #fff; box-shadow: 0 2px 10px #0006; }

.tab .tab-logo {
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1;
  background: #20233b;
  transition: .18s;
}

.tab[data-platform="tiktok"]  .tab-logo { background: linear-gradient(135deg,#25f4ee 0%,#000 50%,#fe2c55 100%); color:#fff; }
.tab[data-platform="youtube"] .tab-logo { background: linear-gradient(135deg,#ff0033,#c00); color:#fff; }

.tab.active .tab-logo { transform: scale(1.06); box-shadow: 0 3px 10px #0007; }

.tab .tab-status {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #3a3d5a;
  transition: .2s;
}

.tab.connected .tab-status {
  background: #22c55e;
  box-shadow: 0 0 0 3px rgba(34,197,94,.2);
}

.panel {
  display: none;
  padding: 15px;
  border: 1px solid #30334f;
  border-radius: 14px;
  background: #111326;
  animation: fade .2s ease;
}

.panel.active { display: block; }

@keyframes fade {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

input, select {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid #373a58;
  border-radius: 10px;
  background: #0c0e1b;
  color: #fff;
  outline: none;
  font: inherit;
  font-size: 13px;
}

input::placeholder { color: #6f7392; }

input:focus, select:focus {
  border-color: #8b7cff;
  box-shadow: 0 0 0 3px #8b7cff18;
}

/* TikTok: pilihan channel (2 pilihan tetap) */
.channel-choice {
  display: grid;
  gap: 8px;
  margin-bottom: 4px;
}

.channel-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 13px;
  border: 1.5px solid #373a58;
  border-radius: 11px;
  background: #0c0e1b;
  cursor: pointer;
  transition: .15s;
}

.channel-option:hover { border-color: #6f7392; background: #10132a; }

.channel-option.selected {
  border-color: #8b7cff;
  background: rgba(139,124,255,.08);
  box-shadow: 0 0 0 3px #8b7cff18;
}

.channel-option input[type="radio"] {
  width: auto;
  padding: 0;
  accent-color: #8b7cff;
  cursor: pointer;
}

.channel-option .ch-name {
  font-weight: 800;
  font-size: 13px;
  color: #fff;
}

.channel-option .ch-sub {
  font-size: 11px;
  color: #8589a6;
  margin-left: auto;
}

/* YouTube: multi baris */
.rows {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.row-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 7px;
  align-items: stretch;
  animation: rowIn .18s ease;
}

@keyframes rowIn {
  from { opacity: 0; transform: translateY(-3px); }
  to   { opacity: 1; transform: none; }
}

.row-remove {
  width: 38px;
  border: 1px solid #373a58;
  border-radius: 10px;
  background: #15172a;
  color: #8589a6;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
  transition: .15s;
  display: grid;
  place-items: center;
}

.row-remove:hover {
  background: #2a1a2e;
  color: #ec4899;
  border-color: #ec4899;
}

.row-remove.hidden { visibility: hidden; }

.add-row-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  margin-top: 8px;
  padding: 9px;
  background: transparent;
  border: 1.5px dashed #4b4f66;
  border-radius: 10px;
  color: #a9afc4;
  font-size: 12px;
  font-weight: 750;
  cursor: pointer;
  transition: .15s;
}

.add-row-btn:hover {
  border-color: #8b5cf6;
  color: #c4b5fd;
  background: rgba(139,92,246,.06);
}

.add-row-btn span {
  display: inline-grid;
  place-items: center;
  width: 18px;
  height: 18px;
  background: #7c3aed;
  border-radius: 50%;
  color: #fff;
  font-size: 14px;
  font-weight: 900;
  line-height: 1;
}

.connect-btn {
  padding: 0 16px;
  border: 0;
  border-radius: 10px;
  background: #7667ff;
  color: #fff;
  font-weight: 800;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  min-width: 92px;
  transition: .15s;
}

.connect-btn:hover { filter: brightness(1.1); }
.connect-btn:disabled { opacity: .55; cursor: wait; }
.connect-btn.connected { background: #1f7a4a; }

.panel .connect-btn.full {
  width: 100%;
  padding: 11px;
  margin-top: 10px;
}

.hint {
  margin-top: 9px;
  color: #8589a6;
  font-size: 11px;
  line-height: 1.55;
}

.hint code {
  background: #0c0e1b;
  padding: 1px 5px;
  border-radius: 4px;
  font-size: 10.5px;
  color: #b3b8e0;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 16px;
}

.main-btn, .secondary-btn {
  padding: 13px;
  border-radius: 12px;
  font-weight: 800;
  font-size: 12px;
  cursor: pointer;
  color: #fff;
  transition: .15s;
}

.main-btn {
  border: 0;
  background: linear-gradient(100deg, #7667ff, #9b5cff);
}

.main-btn:hover { filter: brightness(1.08); }

.secondary-btn {
  border: 1px solid #383b5b;
  background: #15172a;
}

.secondary-btn:hover { background: #1b1e33; }

button:disabled { opacity: .55; cursor: wait; }

#status {
  margin-top: 14px;
  padding: 12px;
  border-radius: 11px;
  background: #0c0e1b;
  color: #c9cbe0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 12px;
  line-height: 1.6;
  border: 1px solid #262a44;
  max-height: 200px;
  overflow-y: auto;
}

@media (max-width: 480px) {
  .card { padding: 16px; }
  .connect-btn { min-height: 42px; }
  .actions { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<main class="card">

  <h1>🎙️ Live Chat Connector</h1>
  <p class="subtitle">
    TikTok LIVE & YouTube → ChatWidget Studio. Pilih salah satu channel TikTok di bawah.
  </p>

  <!-- TABS -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-platform="tiktok">
      <div class="tab-logo">♪</div>
      TikTok
      <span class="tab-status"></span>
    </button>
    <button class="tab" data-platform="youtube">
      <div class="tab-logo">▶</div>
      YouTube
      <span class="tab-status"></span>
    </button>
  </div>

  <!-- PANEL: TIKTOK (3 pilihan tetap) -->
  <section class="panel active" data-platform="tiktok">
    <div class="channel-choice" id="ttChoice">
      <label class="channel-option selected" data-user="veroeugolius">
        <input type="radio" name="ttChannel" value="veroeugolius" checked>
        <span class="ch-name">@veroeugolius</span>
        <span class="ch-sub">default</span>
      </label>
      <label class="channel-option" data-user="mitsuki.aikaa">
        <input type="radio" name="ttChannel" value="mitsuki.aikaa">
        <span class="ch-name">@mitsuki.aikaa</span>
        <span class="ch-sub">alternatif</span>
      </label>
      <label class="channel-option" data-user="noxantviel">
        <input type="radio" name="ttChannel" value="noxantviel">
        <span class="ch-name">@noxantviel</span>
        <span class="ch-sub">alternatif</span>
      </label>
    </div>

    <button class="connect-btn full">
      Hubungkan @veroeugolius
    </button>

    <div class="hint">
      Pilih salah satu channel di atas, lalu klik Hubungkan.
    </div>
  </section>

  <section class="panel" data-platform="youtube">
    <div class="rows" id="ytRows"></div>

    <button class="add-row-btn" id="ytAdd" type="button">
      <span>+</span> Tambah Channel
    </button>

    <button class="connect-btn full">
      Connect YouTube
    </button>

    <div class="hint">
      Contoh: <code>@NamaChannel</code>, <code>dQw4w9WgXcQ</code>,
      atau <code>https://youtube.com/live/xxxxx</code>
    </div>
  </section>

  <!-- ACTIONS -->
  <div class="actions">
    <button id="connectAll" class="main-btn">🔗 Hubungkan Semua</button>
    <button id="openEditor" class="secondary-btn">🎨 Buka Editor</button>
  </div>

  <div id="status">Status: belum ada platform yang terhubung.</div>
</main>

<script>
/* =====================================================
   ELEMENTS
===================================================== */
const tabButtons = [...document.querySelectorAll(".tab")];
const panels     = [...document.querySelectorAll(".panel")];
const statusBox  = document.getElementById("status");
const connectAllButton = document.getElementById("connectAll");
const openEditorButton = document.getElementById("openEditor");

const connectedTikTok = new Set();

function setStatus(message) {
  statusBox.textContent = message;
}

/* =====================================================
   TAB SWITCHER
===================================================== */
tabButtons.forEach(tab => {
  tab.addEventListener("click", () => {
    const platform = tab.dataset.platform;
    tabButtons.forEach(t => t.classList.toggle("active", t === tab));
    panels.forEach(p => p.classList.toggle("active", p.dataset.platform === platform));
  });
});

/* =====================================================
   TIKTOK — pilihan channel (radio)
===================================================== */
const ttChoiceBox = document.getElementById("ttChoice");
const ttButton = document.querySelector('.panel[data-platform="tiktok"] .connect-btn');

function getSelectedTikTok() {
  const checked = ttChoiceBox.querySelector('input[name="ttChannel"]:checked');
  return checked ? checked.value : "veroeugolius";
}

function refreshTikTokButton() {
  const u = getSelectedTikTok();
  if (!ttButton.classList.contains("connected")) {
    ttButton.textContent = `Hubungkan @${u}`;
  }
}

ttChoiceBox.addEventListener("change", () => {
  const selected = getSelectedTikTok();
  ttChoiceBox.querySelectorAll(".channel-option").forEach(opt => {
    opt.classList.toggle("selected", opt.dataset.user === selected);
  });
  refreshTikTokButton();
});

/* =====================================================
   YOUTUBE — multi rows
===================================================== */
function createRow(placeholder, onRemove) {
  const row = document.createElement("div");
  row.className = "row-item";

  const input = document.createElement("input");
  input.type = "text";
  input.className = "username";
  input.placeholder = placeholder;
  input.autocomplete = "off";

  const remove = document.createElement("button");
  remove.type = "button";
  remove.className = "row-remove";
  remove.innerHTML = "×";
  remove.title = "Hapus baris ini";

  remove.onclick = () => {
    row.remove();
    if (typeof onRemove === "function") onRemove();
  };

  row.append(input, remove);
  return row;
}

function setupMultiInput(rowsId, addBtnId, placeholder) {
  const rows = document.getElementById(rowsId);
  const addBtn = document.getElementById(addBtnId);
  if (!rows || !addBtn) return;

  const MIN_ROWS = 3;

  function updateRemoveButtons() {
    const all = rows.querySelectorAll(".row-item");
    const canRemove = all.length > MIN_ROWS;
    all.forEach(item => {
      const btn = item.querySelector(".row-remove");
      btn.classList.toggle("hidden", !canRemove);
    });
  }

  function addRow(focus = false) {
    const row = createRow(placeholder, updateRemoveButtons);
    rows.appendChild(row);
    updateRemoveButtons();
    if (focus) row.querySelector("input").focus();
    return row;
  }

  for (let i = 0; i < MIN_ROWS; i++) addRow();
  addBtn.addEventListener("click", () => addRow(true));
}

setupMultiInput("ytRows", "ytAdd", "@channel / Video ID / link LIVE");

function collectUsernames(panel, platform) {
  const inputs = panel.querySelectorAll(".username");
  const raw = [...inputs].map(inp => inp.value.trim()).filter(Boolean);
  return [...new Set(raw.map(name => normalizeUsername(name, platform)).filter(Boolean))];
}

/* =====================================================
   NORMALIZE (khusus YouTube)
===================================================== */
function normalizeUsername(value, platform) {
  const raw = String(value || "").trim();
  if (!raw) return "";
  if (platform === "youtube") return raw;
  return raw.replace(/^@/, "").replace(/\/+$/, "").trim();
}

/* =====================================================
   REQUEST CONNECT
===================================================== */
async function requestConnect(platform, username) {
  const response = await fetch("/connect", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ platform, username })
  });

  let data;
  try {
    data = await response.json();
  } catch {
    throw new Error(`Server mengembalikan HTTP ${response.status}`);
  }

  const ok = data.ok === true || data.success === true;
  if (!response.ok || !ok) {
    throw new Error(data.error || data.message || `HTTP ${response.status}`);
  }
  return data;
}

function setTabConnected(platform, isConnected) {
  const tab = document.querySelector(`.tab[data-platform="${platform}"]`);
  if (tab) tab.classList.toggle("connected", isConnected);
}

/* =====================================================
   CONNECT: TIKTOK (1 pilihan saja)
===================================================== */
async function connectTikTok(panel) {
  const button = panel.querySelector(".connect-btn");
  const username = getSelectedTikTok();

  if (!username) {
    setStatus("❌ Pilih salah satu channel TikTok.");
    return { success: 0, failed: 0 };
  }

  button.disabled = true;
  button.textContent = "Menghubungkan...";

  let success = 0;
  let failed = 0;
  const details = [];

  try {
    if (connectedTikTok.has(username.toLowerCase())) {
      success++;
      details.push(`✅ @${username}: sudah terhubung`);
    } else {
      try {
        const data = await requestConnect("tiktok", username);
        connectedTikTok.add(username.toLowerCase());
        success++;
        details.push(`✅ @${username}: ${data.message || "permintaan diterima"}`);
      } catch (error) {
        failed++;
        details.push(`❌ @${username}: ${error.message}`);
      }
    }

    setTabConnected("tiktok", success > 0);
    button.textContent = success > 0 ? "Connected" : `Hubungkan @${username}`;
    button.classList.toggle("connected", success > 0);

    setStatus(
      `Hasil koneksi TikTok\nBerhasil: ${success}\nGagal: ${failed}\n\n` +
      details.join("\n")
    );
  } finally {
    button.disabled = false;
  }

  return { success, failed };
}

/* =====================================================
   CONNECT: YOUTUBE (multi)
===================================================== */
async function connectYouTube(panel) {
  const button = panel.querySelector(".connect-btn");
  const usernames = collectUsernames(panel, "youtube");

  if (!usernames.length) {
    setStatus("❌ Masukkan minimal satu channel YouTube.");
    panel.querySelector(".username")?.focus();
    return { success: 0, failed: 0 };
  }

  button.disabled = true;
  button.textContent = "Connecting...";

  let success = 0;
  let failed = 0;
  const details = [];

  try {
    for (const username of usernames) {
      try {
        const data = await requestConnect("youtube", username);
        success++;
        details.push(`✅ ${username}: ${data.message || "permintaan diterima"}`);
      } catch (error) {
        failed++;
        details.push(`❌ ${username}: ${error.message}`);
      }
    }

    setTabConnected("youtube", success > 0);
    button.textContent = success > 0 ? "Connected" : "Connect YouTube";
    button.classList.toggle("connected", success > 0);

    setStatus(
      `Hasil koneksi YouTube\nBerhasil: ${success}\nGagal: ${failed}\n\n` +
      details.join("\n")
    );
  } finally {
    button.disabled = false;
  }

  return { success, failed };
}

async function connectPanel(panel) {
  if (panel.dataset.platform === "tiktok") return connectTikTok(panel);
  return connectYouTube(panel);
}

panels.forEach(panel => {
  const button = panel.querySelector(".connect-btn");
  button?.addEventListener("click", () => connectPanel(panel));
});

/* =====================================================
   CONNECT ALL
===================================================== */
connectAllButton.addEventListener("click", async () => {
  connectAllButton.disabled = true;
  connectAllButton.textContent = "⏳ Menghubungkan...";

  let success = 0;
  let failed = 0;

  try {
    for (const panel of panels) {
      let hasInput = false;

      if (panel.dataset.platform === "tiktok") {
        hasInput = !!getSelectedTikTok();
      } else {
        hasInput = [...panel.querySelectorAll(".username")]
          .some(inp => inp.value.trim());
      }

      if (!hasInput) continue;

      const result = await connectPanel(panel);
      success += result.success;
      failed += result.failed;
    }

    setStatus(
      `🔗 Proses selesai\nBerhasil: ${success}\nGagal: ${failed}\n\n` +
      "Jika channel gagal, periksa pesan koneksi & log server."
    );
  } finally {
    connectAllButton.disabled = false;
    connectAllButton.textContent = "🔗 Hubungkan Semua";
  }
});

openEditorButton.addEventListener("click", () => {
  window.location.href = "/editor";
});

/* =====================================================
   WEBSOCKET STATUS
===================================================== */
(function connectStatusWS() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  let ws;

  function applyConnections(conns) {
    const tt = conns?.tiktok || [];
    const yt = conns?.youtube || [];

    setTabConnected("tiktok",  tt.length > 0);
    setTabConnected("youtube", yt.length > 0);

    connectedTikTok.clear();
    tt.forEach(u => connectedTikTok.add(String(u).toLowerCase()));
  }

  function open() {
    try {
      ws = new WebSocket(`${proto}//${location.host}`);

      ws.onopen = () => console.log("[WS] terhubung");

      ws.onmessage = ev => {
        try {
          const d = JSON.parse(ev.data);

          if (d.type === "status" && d.status === "connections") {
            applyConnections(d.connections);
          }

          if (d.type === "source_status") {
            const st = d.status;
            const emoji = st === "connected" ? "🟢"
                        : st === "error"     ? "🔴"
                        : st === "ended"     ? "⚫"
                        : "🟡";
            console.log(`[WS] ${emoji} ${d.platform} ${d.source} → ${st}`, d.error || "");

            const time = new Date().toLocaleTimeString("id-ID", { hour12: false });
            const extra = d.error ? ` — ${d.error}` : "";
            setStatus(`[${time}] ${emoji} ${d.platform} ${d.source} → ${st}${extra}`);
          }

        } catch (err) {
          console.warn("[WS] parse error:", err);
        }
      };

      ws.onclose = () => {
        console.warn("[WS] terputus, reconnect dalam 2s...");
        setTimeout(open, 2000);
      };

      ws.onerror = () => console.warn("[WS] error");

    } catch (err) {
      console.error("[WS] gagal buat koneksi:", err);
      setTimeout(open, 2000);
    }
  }

  open();
})();

/* Init tombol TikTok */
refreshTikTokButton();
</script>
</body>
</html>
